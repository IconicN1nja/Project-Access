<svg viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Compass Star -->
  <g transform="translate(140, 105)">
    <!-- Primary Cardinal Points -->
    <!-- North Point (Dark / Light split) -->
    <polygon points="0,-48 8,-12 0,-12" fill="#1E293B" />
    <polygon points="0,-48 -8,-12 0,-12" fill="#475569" />

    <!-- South Point -->
    <polygon points="0,48 -8,12 0,12" fill="#1E293B" />
    <polygon points="0,48 8,12 0,12" fill="#475569" />

    <!-- East Point -->
    <polygon points="48,0 12,8 12,0" fill="#1E293B" />
    <polygon points="48,0 12,-8 12,0" fill="#475569" />

    <!-- West Point -->
    <polygon points="-48,0 -12,-8 -12,0" fill="#1E293B" />
    <polygon points="-48,0 -12,8 -12,0" fill="#475569" />

    <!-- Secondary Ordinal Points (NW, NE, SW, SE) -->
    <polygon points="28,-28 8,-2 0,-8" fill="#64748B" />
    <polygon points="28,-28 2,-8 8,-2" fill="#94A3B8" />

    <polygon points="-28,-28 -8,-2 0,-8" fill="#94A3B8" />
    <polygon points="-28,-28 -2,-8 -8,-2" fill="#64748B" />

    <polygon points="28,28 8,2 0,8" fill="#94A3B8" />
    <polygon points="28,28 2,8 8,2" fill="#64748B" />

    <polygon points="-28,28 -8,2 0,8" fill="#64748B" />
    <polygon points="-28,28 -2,8 -8,2" fill="#94A3B8" />

    <!-- Central Compass Circle Ring -->
    <circle cx="0" cy="0" r="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2" />
    <circle cx="0" cy="0" r="13" fill="#F8FAFC" />

    <!-- Scales of Justice in Center (Emerald Green) -->
    <!-- Fulcrum & Column -->
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="0" cy="-8" r="1.5" fill="#10B981" />
    <!-- Horizontal Beam -->
    <line x1="-9" y1="-5" x2="9" y2="-5" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" />
    <!-- Left Scale Strings and Pan -->
    <line x1="-9" y1="-5" x2="-11.5" y2="2" stroke="#10B981" stroke-width="0.8" />
    <line x1="-9" y1="-5" x2="-6.5" y2="2" stroke="#10B981" stroke-width="0.8" />
    <path d="M-13 2 Q-9 5 -5 2 Z" fill="#10B981" />
    <!-- Right Scale Strings and Pan -->
    <line x1="9" y1="-5" x2="6.5" y2="2" stroke="#10B981" stroke-width="0.8" />
    <line x1="9" y1="-5" x2="11.5" y2="2" stroke="#10B981" stroke-width="0.8" />
    <path d="M5 2 Q9 5 13 2 Z" fill="#10B981" />

    <!-- Cardinal Labels: N, S, E, W -->
    <text x="0" y="-55" text-anchor="middle" font-family="Newsreader, serif" font-size="14" font-weight="600" fill="#0F172A">N</text>
    <text x="0" y="66" text-anchor="middle" font-family="Newsreader, serif" font-size="14" font-weight="600" fill="#0F172A">S</text>
    <text x="59" y="5" text-anchor="middle" font-family="Newsreader, serif" font-size="14" font-weight="600" fill="#0F172A">E</text>
    <text x="-59" y="5" text-anchor="middle" font-family="Newsreader, serif" font-size="14" font-weight="600" fill="#0F172A">W</text>
  </g>

  <!-- Typography -->
  <text x="140" y="218" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" letter-spacing="0.16em" fill="#1E293B">
    JUSTICE COMPASS
  </text>
  <text x="140" y="238" text-anchor="middle" font-family="Inter, sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.22em" fill="#64748B">
    A LIIC INITIATIVE
  </text>
</svg>
